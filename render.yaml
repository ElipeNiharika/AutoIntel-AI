services:
  - type: web
    name: autointel-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: 'pip install --upgrade pip && pip install -r requirements.txt'
    startCommand: 'gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:'
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: FLASK_SECRET
        generateValue: true
      - key: PORT
        value: 10000
