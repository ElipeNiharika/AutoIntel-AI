version: '3.8'
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MYSQL_URL=mysql+mysqlconnector://root:example@db/ai_vehicle_service
      - FLASK_SECRET=change-me
    depends_on:
      - db
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: ai_vehicle_service
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
